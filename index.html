<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Client Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Secure Client Management System</h1>
    <p class="intro">A client-side prototype for collecting and validating client details safely.</p>

    <form id="clientForm" novalidate>
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" autocomplete="name">
        <span class="error" id="nameError"></span>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email">
        <span class="error" id="emailError"></span>
      </div>

      <button type="submit">Add client</button>
      <p class="success" id="formSuccess"></p>
    </form>

    <section class="clients">
      <h2>Saved clients</h2>
      <table id="clientTable" hidden>
        <thead>
          <tr><th>Name</th><th>Email</th><th></th></tr>
        </thead>
        <tbody id="clientRows"></tbody>
      </table>
      <p id="emptyMessage">No clients saved yet.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
